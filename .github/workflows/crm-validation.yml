name: CRM validation
on:
  push:
    branches: [main, integration/crm-v2-production-20260918]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: crm-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Syntax validation
        run: |
          node --check app.js
          node --check recuperar.js
          node --check tests/browser-fixture.js
          for file in *.mjs api/*.mjs scripts/*.mjs scripts/*.cjs; do node --check "$file"; done
      - name: Unit and interface contract tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-artifacts
          npm test 2>&1 | tee review-artifacts/unit-tests.txt
      - name: Install isolated browser runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Full navigation and access regression with isolated fixtures
        run: python tests/browser-smoke.py
      - name: Editor linked-field regression
        run: python tests/editor-fields.py
      - name: Conversation SQL and browser fixture regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/preview-conversations.mjs > review-artifacts/conversations-server.txt 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then ready=true; break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          "$ready"
          SCREENSHOT_PATH=review-artifacts/conversations-desktop.png node scripts/verify-conversations-browser.cjs 2>&1 | tee review-artifacts/conversations-browser.txt
          node scripts/verify-conversations-navigation.cjs 2>&1 | tee review-artifacts/conversations-navigation.txt
      - name: Package reviewed sources without credentials or customer data
        if: always()
        run: |
          mkdir -p review-artifacts
          git archive --format=tar HEAD > review-artifacts/candidate-source.tar
          git archive --format=tar c2d92406b41854a8f4fc931bbbfff2ead574e6fd > review-artifacts/main-before-consolidation.tar
          git rev-parse HEAD > review-artifacts/commit.txt
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crm-reviewed-sources
          path: review-artifacts/
          retention-days: 7
  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify exact deployed files and genuine signed-out access
        run: python tests/verify-production.py
      - name: Verify navigation against deployed application assets with isolated data
        run: python tests/browser-smoke.py --base-url https://xicronix-commercial-intelligence.vercel.app/ --output review-artifacts/production-fixture-browser
      - name: Verify deployed edit forms with isolated fixtures
        run: python tests/editor-fields.py --base-url https://xicronix-commercial-intelligence.vercel.app/ --output review-artifacts/production-editor-fields
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crm-production-evidence
          path: review-artifacts/
          retention-days: 7

  quotation-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install isolated quotation test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify quotation UI using deployed modules and synthetic data
        run: python tests/quote-browser.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quotation-ui-evidence
          path: review-artifacts/quote-browser/
          retention-days: 7
