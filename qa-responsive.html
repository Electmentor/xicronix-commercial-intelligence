<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>QA sintética · vista responsive</title><style>body{margin:0;background:#d9e2ee;font:14px/1.4 system-ui;color:#10243a}header{padding:12px 18px;background:#fff}nav{display:flex;gap:14px;flex-wrap:wrap}a{color:#165ca2}p{margin:8px 0}main{padding:16px;width:max-content}iframe{display:block;border:0;background:#fff;box-shadow:0 3px 18px #193a5a33}code{font:12px monospace}</style></head><body><header><strong>QA sintética. Sin envío real, sin datos reales.</strong><nav><a id="mobileLink">Móvil 390 × 844</a><a id="desktopLink">Escritorio 1440 × 900</a><a id="webLink">Solicitud web</a><a id="contextLink">Correo 28 de septiembre</a><a id="controlsLink">Alternar controles QA</a></nav><p id="measurement" role="status">Midiendo viewport interno…</p><small>El iframe conserva app y CSS exactos. Solo cambia su viewport; no se emulan agente móvil ni pantalla táctil.</small></header><main><iframe id="crmFixture" title="CRM sintético responsive"></iframe></main><script>
const query=new URLSearchParams(location.search),mode=query.get('view')==='desktop'?'desktop':'mobile',scenario=query.get('scenario')==='context'?'context':'web',qa=query.get('qa')==='0'?'0':'1';
function link(id,changes){const q=new URLSearchParams({view:mode,scenario,qa,...changes});document.getElementById(id).href='qa-responsive.html?'+q;}
link('mobileLink',{view:'mobile'});link('desktopLink',{view:'desktop'});link('webLink',{scenario:'web'});link('contextLink',{scenario:'context'});link('controlsLink',{qa:qa==='1'?'0':'1'});
const frame=document.getElementById('crmFixture'),width=mode==='mobile'?390:1440,height=mode==='mobile'?844:900;frame.width=width;frame.height=height;frame.style.width=width+'px';frame.style.height=height+'px';
frame.src='crm-qa-fixture.html?'+new URLSearchParams({scenario,qa});
frame.addEventListener('load',()=>{const inner=frame.contentWindow;document.getElementById('measurement').textContent='Viewport interno real: '+inner.innerWidth+' × '+inner.innerHeight+' px. Escenario: '+scenario+'. Controles: '+(qa==='1'?'visibles':'ocultos')+'.';});
</script></body></html>
